<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Square Game</title>
        
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="game.css">
        <script type="text/javascript" src="game.js"></script>

   
        <style>
            body {
                background-image: url('pic/galaxy.jpg');
                background-size: cover; 
                background-position: center; 
                background-attachment: fixed; 
                background-repeat: no-repeat; 
            }
        </style>
    </head>
    <body>
        <fieldset class="glass-panel">
            <legend>SquareLaxy Game 🌌</legend>
            
            <div class="control-grid">
                <div class="input-group">
                    <label for="numbox">Number of box:</label>
                    <input type="text" name="numbox" id="numbox" placeholder="Enter number of box" value="10">
                </div>
                
                <div class="input-group">
                    <label for="color">Color:</label>
                    <select name="color" id="color">
                        <option value="maroon">🔴 Maroon</option>
                        <option value="lightgreen">🟢 Lightgreen</option>
                        <option value="magenta">🟣 Magenta</option>
                        <option value="blue">🔵 Blue</option>
                        <option value="orange">🟠 Orange</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="time">Time:</label>
                    <select name="time" id="time">
                           <option value="6">⏱ 6 sec</option>
                        <option value="30">⏱ 30 sec</option>
                        <option value="60">⏱ 60 sec</option>
                    </select>
                </div>
                
                <div class="button-group">
                    <button id="start">Start</button>
                    <button id="stop">Stop</button>
                </div>
                
                <div id="timerClock"> 
                    ⏳ <span id="clock">0</span>
                </div>
            </div>
        </fieldset>

        <div id="container">
            <div id="layer"></div>
        </div>
    </body>
</html>
